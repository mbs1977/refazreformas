name: Importar codigo do site

on:
  push:
    paths:
      - '.import/**'
      - '.github/workflows/import-site.yml'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Reconstruir e extrair o projeto
        shell: bash
        run: |
          cat .import/part-* > /tmp/refaz-site.tar.gz
          tar -xzf /tmp/refaz-site.tar.gz
          rm -rf .import

      - name: Publicar estrutura completa
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importa codigo completo do site Refaz"
          git push
